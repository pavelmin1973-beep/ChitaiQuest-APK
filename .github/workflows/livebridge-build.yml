name: LiveBridge Android APK
on:
  push:
    branches:
      - build/livebridge-alpha-0-1
    paths:
      - .github/workflows/livebridge-build.yml
      - livebridge-src.b64
jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unpack isolated LiveBridge project
        run: |
          mkdir -p project
          base64 --decode livebridge-src.b64 | xz --decompress | tar --extract -C project
          test -f project/app/build.gradle.kts
      - name: Assemble LiveBridge debug APK
        working-directory: project
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Upload installable APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LiveBridge-0.1-alpha-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
